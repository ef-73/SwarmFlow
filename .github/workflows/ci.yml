# GitHub Actions runs the same referee as local integration (design §14.3): scripts/ci.sh in the dev image.
# The script is taken from the BASE branch (main), so a branch cannot weaken its own referee.
name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Referee script from the base branch
        run: |
          git fetch origin main
          git show origin/main:scripts/ci.sh > "$RUNNER_TEMP/ci.sh"
      - name: Build dev image
        run: docker compose build dev
      - name: scripts/ci.sh
        env:
          CI_BASE: origin/main
          COMPOSE_PROJECT_NAME: swarmflow-ci
        run: |
          status=0
          bash "$RUNNER_TEMP/ci.sh" 2>&1 | tee "$RUNNER_TEMP/ci.log" || status=$?
          # Logs need a GitHub sign-in; annotations are public, so surface the failing lines as annotations.
          if [ "$status" != 0 ]; then
            grep -E "FAIL|RED|Error|error:|failed|FAILED|Traceback|assert" "$RUNNER_TEMP/ci.log" | head -30 > "$RUNNER_TEMP/fail.txt" || true
            while IFS= read -r l; do echo "::error::${l//%/%25}"; done < "$RUNNER_TEMP/fail.txt"
          fi
          exit $status
