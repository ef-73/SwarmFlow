# SwarmFlow services (design §8.3). Paths are relative to this file (docker/).
# Every Gazebo-starting service carries label swarmflow.sim=1 (CONTRIBUTING.md).

x-ros-env: &ros-env
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_DOMAIN_ID: "0"
  GZ_PARTITION: swarmflow
  GZ_SIM_RESOURCE_PATH: /ws/install/swarmflow_description/share:/ws/install/swarmflow_gazebo/share
  # realism ladder rung 3 (I-01): netem arguments for the robot containers' egress, e.g. "delay 50ms 10ms loss 1%"
  SWARMFLOW_NETEM: ${SWARMFLOW_NETEM:-}
  # E-01: other robots' predicted positions (OtherRobotsLayer horizon, s); empty = the profile default (2.0)
  SWARMFLOW_PREDICTION_HORIZON: ${SWARMFLOW_PREDICTION_HORIZON:-}
  SWARMFLOW_FOOTPRINT_CRITIC: ${SWARMFLOW_FOOTPRINT_CRITIC:-}
  SWARMFLOW_PREDICT_ALONG_PLAN: ${SWARMFLOW_PREDICT_ALONG_PLAN:-}
  # T068: robots yield on reserved trajectories / break deadlock cycles (1 = on)
  SWARMFLOW_YIELD: ${SWARMFLOW_YIELD:-}
  SWARMFLOW_UNJAM: ${SWARMFLOW_UNJAM:-}
  # T069: smoother motion profile (1 = on)
  SWARMFLOW_SMOOTH: ${SWARMFLOW_SMOOTH:-}

services:
  dev:
    # Never started by `up` (replicas 0); used via `docker compose run --rm dev <cmd>`. Kept out of profiles so
    # the sim/robot images can build FROM it (additional_contexts: service:dev).
    deploy:
      replicas: 0
    image: swarmflow/dev:latest
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    environment:
      <<: *ros-env
      SWARMFLOW_GUI: none
    volumes:
      - ..:/ws
      - build:/ws/build
      - install:/ws/install
      - log:/ws/log
    networks: [swarmflow]

  gazebo:
    image: swarmflow/sim:latest
    build:
      context: ..
      dockerfile: docker/sim.Dockerfile
      additional_contexts:
        dev: service:dev
    labels:
      swarmflow.sim: "1"
    environment:
      <<: *ros-env
      SWARMFLOW_LIDAR_NOISE: ${SWARMFLOW_LIDAR_NOISE:-0.01}
      SWARMFLOW_LIDAR_RANGE: ${SWARMFLOW_LIDAR_RANGE:-8.0}
    command: ["ros2", "launch", "swarmflow_gazebo", "sim.launch.py", "layout:=${SWARMFLOW_LAYOUT:-standard}",
              "robots:=${SWARMFLOW_ROBOTS:-robot_1,robot_2,robot_3}", "rtf:=${SWARMFLOW_RTF:-1.0}"]
    healthcheck:   # world loaded and sim time advancing
      test: ["CMD", "/entrypoint.sh", "bash", "-c", "timeout 5 gz topic -e -n 1 -t /clock >/dev/null"]
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 10s
    networks: [swarmflow]

  gazebo_gui:
    # Off by default (T021: Foxglove is the main view). Start it with `docker compose --profile gui up`.
    profiles: ["gui"]
    image: swarmflow/sim:latest
    labels:
      swarmflow.sim: "1"
    depends_on:
      gazebo:
        condition: service_started
    environment:
      <<: *ros-env
      SWARMFLOW_GUI: ${SWARMFLOW_GUI:-wslg}
      DISPLAY: ":0"
      WAYLAND_DISPLAY: wayland-0
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: /mnt/wslg/PulseServer
      # WSL GPU (design §8.5 item 2): Mesa's d3d12 driver via /dev/dxg; without it the GUI software-renders (~5 cores).
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: d3d12
      # Intel Arc via d3d12 renders a black Ogre2 scene (M1 spike); the NVIDIA adapter renders correctly.
      MESA_D3D12_DEFAULT_ADAPTER_NAME: ${SWARMFLOW_GPU_ADAPTER:-NVIDIA}
    devices:
      - /dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # Docker Desktop's path to the WSLg sockets (short syntax: a missing host path does not block startup).
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix
      - /run/desktop/mnt/host/wslg:/mnt/wslg
    ports:
      - "127.0.0.1:6080:6080"   # localhost only: the noVNC view has no password
    command: ["gui.sh"]
    networks: [swarmflow]

  robot_1: &robot
    image: swarmflow/robot:latest
    build:
      context: ..
      dockerfile: docker/robot.Dockerfile
      additional_contexts:
        dev: service:dev
    depends_on:
      gazebo:
        condition: service_healthy
    environment:
      <<: *ros-env
      ROBOT_ID: robot_1
    cap_add: [NET_ADMIN]          # tc netem for SWARMFLOW_NETEM (realism ladder)
    command: ["bash", "-c", "if [ -n \"$$SWARMFLOW_NETEM\" ]; then tc qdisc replace dev eth0 root netem $$SWARMFLOW_NETEM && echo netem: $$SWARMFLOW_NETEM; fi; ros2 launch swarmflow_nav robot.launch.py robot_id:=$$ROBOT_ID layout:=${SWARMFLOW_LAYOUT:-standard} localization:=${SWARMFLOW_LOCALIZATION:-ground_truth} agent:=${SWARMFLOW_AGENT:-true} traffic_control:=${SWARMFLOW_TRAFFIC_CONTROL:-true}"]
    # X-06: restart a crashed service (not one stopped by `down`); cheap process check, no ROS CLI
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f component_container_isolated >/dev/null && pgrep -f robot_state_publisher >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [swarmflow]

  robot_2:
    <<: *robot
    environment:
      <<: *ros-env
      ROBOT_ID: robot_2

  robot_3:
    <<: *robot
    environment:
      <<: *ros-env
      ROBOT_ID: robot_3

  # v2 runs with 4-5 robots (L-04): started only when named (demo_run.sh) or with --profile extra_robots
  robot_4:
    <<: *robot
    profiles: ["extra_robots"]
    environment:
      <<: *ros-env
      ROBOT_ID: robot_4

  robot_5:
    <<: *robot
    profiles: ["extra_robots"]
    environment:
      <<: *ros-env
      ROBOT_ID: robot_5

  orchestrator:
    image: swarmflow/robot:latest
    depends_on:
      gazebo:
        condition: service_healthy
    environment:
      <<: *ros-env
      SWARMFLOW_POLICY: ${SWARMFLOW_POLICY:-fcfs}
      SWARMFLOW_ROBOTS: ${SWARMFLOW_ROBOTS:-robot_1,robot_2,robot_3}
      SWARMFLOW_RUN_ID: ${SWARMFLOW_RUN_ID:-}
      SWARMFLOW_SCENARIO: ${SWARMFLOW_SCENARIO:-v1_demo}
    volumes:
      - ../runs:/ws/runs
    command: ["ros2", "launch", "swarmflow_orchestrator", "orchestrator.launch.py", "layout:=${SWARMFLOW_LAYOUT:-standard}"]
    # X-06: restart a crashed service (not one stopped by `down`); cheap process check, no ROS CLI
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f orchestrator_node >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [swarmflow]

  scenario_engine:
    image: swarmflow/robot:latest
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      <<: *ros-env
      SWARMFLOW_POLICY: ${SWARMFLOW_POLICY:-fcfs}
      SWARMFLOW_RUN_ID: ${SWARMFLOW_RUN_ID:-}
      SWARMFLOW_SCENARIO: ${SWARMFLOW_SCENARIO:-v1_demo}
      SWARMFLOW_GIT_SHA: ${SWARMFLOW_GIT_SHA:-}
      SWARMFLOW_IMAGE_DIGESTS: ${SWARMFLOW_IMAGE_DIGESTS:-}
    volumes:
      - ../runs:/ws/runs
    command: ["ros2", "launch", "swarmflow_scenarios", "scenario_engine.launch.py", "layout:=${SWARMFLOW_LAYOUT:-standard}"]
    # X-06: restart a crashed service (not one stopped by `down`); cheap process check, no ROS CLI
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f scenario_engine >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [swarmflow]

  payload:
    image: swarmflow/sim:latest
    depends_on:
      gazebo:
        condition: service_healthy
    environment:
      <<: *ros-env
      SWARMFLOW_ROBOTS: ${SWARMFLOW_ROBOTS:-robot_1,robot_2,robot_3}
    command: ["ros2", "launch", "swarmflow_payload", "payload.launch.py", "layout:=${SWARMFLOW_LAYOUT:-standard}"]
    # X-06: restart a crashed service (not one stopped by `down`); cheap process check, no ROS CLI
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f payload_node >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [swarmflow]

  viz:
    image: swarmflow/sim:latest     # gz-transport Python bindings: package poses straight from Gazebo (T021)
    environment:
      <<: *ros-env
      SWARMFLOW_LAYOUTS_ROOT: /ws/layouts
      SWARMFLOW_ROBOTS: ${SWARMFLOW_ROBOTS:-robot_1,robot_2,robot_3}
    command: ["ros2", "launch", "swarmflow_viz", "viz.launch.py", "layout:=${SWARMFLOW_LAYOUT:-standard}"]
    # X-06: restart a crashed service (not one stopped by `down`); cheap process check, no ROS CLI
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f viz_node >/dev/null && pgrep -f tf_relay >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [swarmflow]

  foxglove_bridge:
    image: swarmflow/robot:latest
    build:
      context: ..
      dockerfile: docker/robot.Dockerfile
      additional_contexts:
        dev: service:dev
    environment:
      <<: *ros-env
    # Only what the Foxglove layout shows (T021): raw scans, costmaps, maps and odometry stay off the WebSocket.
    # Clients may publish orders only; parameter polling of every node is off.
    command: ["ros2", "launch", "foxglove_bridge", "foxglove_bridge_launch.xml", "port:=8765", "use_sim_time:=true",
              "topic_whitelist:=['^/tf$', '^/tf_static$', '^/viz/.*', '^/fleet/.*', '^/robot_[0-9]+/plan$']",
              "client_topic_whitelist:=['^/fleet/orders$']", "service_whitelist:=['^/fleet/.*']",
              "param_whitelist:=['(?!)']"]
    # X-06: restart a crashed service (not one stopped by `down`); cheap process check, no ROS CLI
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "bash", "-c", "pgrep -f foxglove_bridge >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:8765:8765"   # localhost only: the Foxglove bridge is unauthenticated
    networks: [swarmflow]

networks:
  swarmflow: {}

volumes:
  build: {}
  install: {}
  log: {}
