# Light mode (T025): kinematic robots + the real orchestrator/agents, no Gazebo. About one core for 10 robots.
#   docker compose -f docker/compose.light.yaml up
# Env: SWARMFLOW_SCENARIO (v2_demo), SWARMFLOW_ROBOTS (5), SWARMFLOW_RTF (1.0), SWARMFLOW_RUN_ID, SWARMFLOW_LAYOUT (warehouse_v2).
# Nothing here starts Gazebo, so no service carries the swarmflow.sim=1 label.

x-ros-env: &ros-env
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_DOMAIN_ID: "0"

services:
  light:
    image: swarmflow/robot:latest
    environment:
      <<: *ros-env
      PYTHONPATH: /ws/sim2d
    volumes:
      - ../sim2d:/ws/sim2d:ro
      - ../runs:/ws/runs
    command: ["python3", "-m", "sim2d.light",
              "--layout-dir", "/ws/layouts/${SWARMFLOW_LAYOUT:-warehouse_v2}/generated",
              "--robots", "${SWARMFLOW_ROBOTS:-robot_1,robot_2,robot_3,robot_4,robot_5}",
              "--scenario", "/ws/scenarios/${SWARMFLOW_SCENARIO:-v2_demo}.yaml",
              "--run-dir", "/ws/runs/${SWARMFLOW_RUN_ID:-light-latest}",
              "--rtf", "${SWARMFLOW_RTF:-1.0}"]
    networks: [swarmflow]

  viz:
    image: swarmflow/robot:latest     # falls back without the gz bindings
    environment:
      <<: *ros-env
      SWARMFLOW_LAYOUTS_ROOT: /ws/layouts
      SWARMFLOW_ROBOTS: ${SWARMFLOW_ROBOTS:-robot_1,robot_2,robot_3,robot_4,robot_5}
    command: ["ros2", "launch", "swarmflow_viz", "viz.launch.py", "layout:=${SWARMFLOW_LAYOUT:-warehouse_v2}"]
    networks: [swarmflow]

  foxglove_bridge:
    image: swarmflow/robot:latest
    environment:
      <<: *ros-env
    command: ["ros2", "launch", "foxglove_bridge", "foxglove_bridge_launch.xml", "port:=8765", "use_sim_time:=true",
              "topic_whitelist:=['^/tf$', '^/tf_static$', '^/viz/.*', '^/fleet/.*', '^/robot_[0-9]+/plan$']",
              "client_topic_whitelist:=['^/fleet/orders$']", "service_whitelist:=['^/fleet/.*']",
              "param_whitelist:=['(?!)']"]
    ports:
      - "127.0.0.1:8765:8765"   # localhost only: the Foxglove bridge is unauthenticated
    networks: [swarmflow]

networks:
  swarmflow: {}
