# v1 corridor stress (design 13.5): two robots meet head-on in storage aisle Z_aisle_2 every ~60 s.
#
# Choreography (timing found with swarmflow_core.backends.fake.run_fake under the T014 station claims; the lead
# re-tunes it in Gazebo, M7): robot_1 spawns at P1 (south-west) and robot_3 at P3 (south-east); robot_2 is not used.
# Station claims stop two orders sharing a dropoff (until it is delivered) or a pickup (until it is picked up), so
# the two orders of each 60 s cycle use the SAME pickup but DIFFERENT dropoffs: L2 -> D2 at t=4 s and L2 -> D1 at
# t=24 s. L2 is only claimed until the load dwell ends, so the second order starts as soon as the first robot has
# left L2. The loaded robot crosses Z_aisle_2 west -> east (X_2_1 -> X_2_3); the robot that just delivered at D1/D2
# (east side) must come back west through the same aisle (east -> west, empty) to reach L2, so the two directions
# overlap. With FCFS reservations one robot is denied and holds at H_2_1 / H_2_3; with `independent` both drive
# into the 1.3 m aisle (max 2 robots in the zone). In the fake backend FCFS denies occur in sim-minutes 1, 2, 3
# and 4 (about 52 denies in 300 s).
name: v1_corridor
seed: 1
duration_s: 300
layout: standard
policy: fcfs
robots: [robot_1, robot_3]
orders:
  mode: explicit
  repeat_every_s: 60
  list:
    - {t: 4.0, pickup: L2, dropoff: D2}
    - {t: 24.0, pickup: L2, dropoff: D1}
