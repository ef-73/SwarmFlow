# v1 corridor stress (design 13.5): two robots meet head-on in storage aisle Z_aisle_2 every 60 s.
#
# Choreography (timing designed with swarmflow_core.backends.fake.run_fake; the lead re-tunes it in Gazebo, M7):
# robot_1 spawns at P1 (south-west) and robot_3 at P3 (south-east); robot_2 is not used (2 robots keep the
# aisle the only contention point). Every order is L2 -> D2, so the loaded leg always crosses Z_aisle_2
# west -> east, while a robot that just delivered at D2 (east side) must come back west through the same aisle
# (east -> west, empty) to reach L2 for its next order. Two orders per 60 s cycle, released 12 s apart, line up the
# phases so that robot A's empty westbound entry (east end, X_2_3) and robot B's loaded eastbound entry
# (west end, X_2_1) happen within ~5 s of each other: with FCFS reservations one is denied and holds at
# H_2_1 / H_2_3, with `independent` both drive into the 1.3 m aisle. The arrival rate slightly exceeds one
# order per robot round trip, so a backlog builds up, but the opposing-entry phase (checked with the independent
# policy, no waiting) stays aligned (pairs 1-2 s apart, roughly every 44 s, so at least once per 60 s cycle).
name: v1_corridor
seed: 1
duration_s: 300
layout: standard
policy: fcfs
robots: [robot_1, robot_3]
orders:
  mode: explicit
  repeat_every_s: 60
  list:
    - {t: 0.0, pickup: L2, dropoff: D2}
    - {t: 12.0, pickup: L2, dropoff: D2}
