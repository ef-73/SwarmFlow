[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmflow-sim2d"
version = "0.1.0"
description = "SwarmFlow 2D kinematic backend (drives the real AgentCore against the fleet layer)"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[tool.setuptools]
packages = ["sim2d"]
